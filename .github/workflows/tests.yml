name: tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Run transfer test script
        run: python scripts/run_transfer_tests.py
      - name: Verify generated transfer outputs are current
        run: git diff --exit-code data/results
