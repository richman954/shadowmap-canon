[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shadowmap-canon"
version = "0.1.0"
description = "Canonical ShadowMap notes and tensor-message transfer-test utilities."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23"]
authors = [{name = "ShadowMap Canon Maintainers"}]

[tool.setuptools.packages.find]
where = ["src"]
